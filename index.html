<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>GPU N-Body Симуляция: Солнечная Система</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010208;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
        }

        /* Стили для нового меню управления */
        #menu {
            position: absolute;
            top: 200px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 5px;
            width: 220px;
            z-index: 10;
            border: 1px solid #333;
        }

        #reload {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.85em;
            margin-bottom: 4px;
            color: #aaa;
        }

        .input-group input[type="number"],
        .input-group input[type="range"] {
            width: 100%;
            box-sizing: border-box;
        }

        .slider-val {
            font-size: 0.8em;
            float: right;
            color: #00aaff;
        }

        #spawnBtn {
            width: 100%;
            padding: 8px;
            background: #00aaff;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        #spawnBtn:hover {
            background: #0088cc;
        }

        /* CSS Прицел в центре экрана */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            display: none;
            /* По умолчанию скрыт */
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
        }

        /* Горизонтальная линия */
        #crosshair::before {
            top: 9px;
            left: 0;
            width: 20px;
            height: 2px;
        }

        /* Вертикальная линия */
        #crosshair::after {
            top: 0;
            left: 9px;
            width: 2px;
            height: 20px;
        }
    </style>
</head>

<body>
    <div id="reload">
        <div style="margin-bottom: 10px;">
            <label for="modeSelect" style="font-size: 0.9em; color: #ccc; display: block; margin-bottom: 4px;">Режим
                симуляции:</label>
            <select id="modeSelect"
                style="background: #111525; color: #fff; border: 1px solid #334477; padding: 6px; width: 100%; border-radius: 4px; cursor: pointer;">
                <option value="SOLAR_SYSTEM">Солнечная Система</option>
                <option value="STAR_CLOUD">Звездное облако</option>
                <option value="GALAXY">Галактика (1 ядро)</option>
                <option value="EMPTY">Пустой космос (0 тел)</option>
                <option value="MULTIPLE_GALAXIES">Кластер галактик</option>
                <option value="RANDOM">Случайный хаос</option>
                <option value="REALGALAXY">Реалистичная галактика)))))))</option>
            </select>
        </div>
        <div class="input-group">
            <label for="starInput">Кол-во звёзд: <span id="starVal" class="slider-val">0</span></label>
            <input type="range" id="starInput" min="0" max="30000" value="0" step="100">
        </div>
        <button id="restartBtn"
            style="background: #00aaff; color: #fff; border: none; padding: 8px 12px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: background 0.2s;">
            Перезапустить
        </button>
        <button id="resetCamBtn"
            style="background: #00aaff; color: #fff; border: none; padding: 8px 12px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: background 0.2s;">
            Сбросить камеру
        </button>
        <div class="input-group">
            <label for="speedInput">Скорость симуляции: <span id="speedVal" class="slider-val">1.0</span></label>
            <input type="range" id="speedInput" min="0.1" max="5" value="1" step="0.1">
        </div>
    </div>

    <div id="info">
        <small>
            Даблклик — создать тяжелую звезду<br>
            Колесо — зум, зажать мышкой — двигать<br>
            <strong>Пробел — Пауза, G — Показать сетку</strong><br>
            <span id="modeInfo">Режим: Солнечная система</span>
            <div style="font-size: 0.9em; color: #ccc; margin-bottom: 3px;">
                Тел в симуляции: <span id="starCountVal" style="color: #fff; font-weight: bold;">0</span>
            </div>
            <div style="font-size: 0.9em; color: #ccc; margin-bottom: 5px;">
                Гравитационная постоянная (G): <span id="gConstantVal"
                    style="color: #ffcc00; font-weight: bold;">0</span>
            </div>
            <span id="pauseInfo" style="color: #ff4440; display: none;"><b>СИМУЛЯЦИЯ НА ПАУЗЕ</b></span>
            <br><span id="gridStepInfo" style="color: #00aaff; font-size: 0.9em; display: none;">Шаг сетки: <span
                    id="gridStepVal">100</span> у.е.</span>
        </small>
    </div>

    <!-- НОВОЕ МЕНЮ -->
    <div id="menu">
        <h4 style="margin: 0 0 10px 0; font-size: 0.95em; text-transform: uppercase; letter-spacing: 1px;">Добавить
            объект</h4>

        <div class="input-group">
            <label for="massInput">Масса:</label>
            <input type="number" id="massInput" value="1000" min="1">
        </div>

        <div class="input-group">
            <label for="vxInput">Скорость X: <span id="vxVal" class="slider-val">0</span></label>
            <input type="range" id="vxInput" min="-250" max="250" value="0" step="5">
        </div>

        <div class="input-group">
            <label for="vyInput">Скорость Y: <span id="vyVal" class="slider-val">0</span></label>
            <input type="range" id="vyInput" min="-250" max="250" value="0" step="5">
        </div>

        <button id="spawnBtn">Создать в центре экрана</button>
    </div>

    <!-- ПРИЦЕЛ -->
    <div id="crosshair"></div>

    <canvas id="simulationCanvas"></canvas>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
