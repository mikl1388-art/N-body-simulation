<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>N-Body Гравитационная Симуляция PixiJS v8</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #010208; }
        canvas { display: block; }
    </style>
    <!-- Подключаем стабильную версию PixiJS v8 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.1.0/pixi.min.js"></script>
</head>
<body>

<script>
// --- Настройки симуляции ---
const STAR_COUNT = 1500; 
const G = 0.5;           
const SOFTENING = 15;    
const DT = 0.5;       
const INITIAL_VELOCITY_SCALE = 0.4;
const MAX_RARIUS_SCALE = 0.5;
const RANDOM_RADIUS = true;

const MIN_MASS = 1;
const MAX_MASS = 12;      // Диапазон масс

// --- Функция генерации цветов из градиента прямо в JS ---
function getGradientColor(ratio) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 1;
    const ctx = canvas.getContext('2d');

    const gradient = ctx.createLinearGradient(0, 0, 256, 0);
    gradient.addColorStop(0.0, '#ff4400'); // Красный (легкие)
    gradient.addColorStop(0.2, '#ffcc00'); // Желтый
    gradient.addColorStop(0.5, '#ffffff'); // Белый (средние)
    gradient.addColorStop(0.8, '#88ccff'); // Голубой
    gradient.addColorStop(1.0, '#0044ff'); // Синий (тяжелые)

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 256, 1);

    // Берем пиксель, соответствующий массе звезды
    const x = Math.max(0, Math.min(255, Math.floor(ratio * 255)));
    const imgData = ctx.getImageData(x, 0, 1, 1).data;
    
    // Превращаем RGB в HEX формат, который понимает PixiJS (например, 0xFFFFFF)
    return (imgData[0] << 16) | (imgData[1] << 8) | imgData[2];
}

async function init() {
    // 1. Инициализация приложения v8
    const app = new PIXI.Application();
    await app.init({ 
        resizeTo: window,
        antialias: true,
        backgroundColor: 0x010208 
    });
    document.body.appendChild(app.canvas);

    // 2. Создаем ОДНУ текстуру круга в памяти
    const g = new PIXI.Graphics();
    g.circle(0, 0, 2.5); // Радиус кружка звезды
    g.fill({ color: 0xffffff });
    const starTexture = app.renderer.generateTexture(g);
    g.destroy(); // Больше этот инструмент не нужен, текстура готова

    // 3. Массив для физики и линков на спрайты
    const stars = [];
    const centerX = app.screen.width / 2;
    const centerY = app.screen.height / 2;

    for (let i = 0; i < STAR_COUNT; i++) {
        // Создаем нативный спрайт из нашей текстуры круга
        const sprite = new PIXI.Sprite(starTexture);
        sprite.anchor.set(0.5); // Центрируем точку спрайта

        const angle = (RANDOM_RADIUS ? Math.random() : (i / (STAR_COUNT+1))) * Math.PI * 2;
        const radius = (RANDOM_RADIUS ? Math.random() : 1) * (Math.min(centerX, centerY) * MAX_RARIUS_SCALE);
        const mass = MIN_MASS + Math.random() * (MAX_MASS - MIN_MASS);
        //console.log(angle, radius);
        
        // Ставим спрайт на начальную позицию
        sprite.x = centerX + Math.cos(angle) * radius;
        sprite.y = centerY + Math.sin(angle) * radius;

        // Красим спрайт в зависимости от его массы
        const ratio = (mass - MIN_MASS) / (MAX_MASS - MIN_MASS);
        sprite.tint = getGradientColor(ratio);

        // Добавляем на экран
        app.stage.addChild(sprite);

        // Сохраняем все данные в один объект
        stars.push({
            sprite: sprite,
            mass: mass,
            vx: -Math.sin(angle) * (Math.sqrt(radius) * INITIAL_VELOCITY_SCALE), 
            vy: Math.cos(angle) * (Math.sqrt(radius) * INITIAL_VELOCITY_SCALE)
        });
    }

    // 4. Главный цикл симуляции
    app.ticker.add(() => {
        // --- Физические расчеты O(N^2) ---
        for (let i = 0; i < STAR_COUNT; i++) {
            let p1 = stars[i];
            let fx = 0;
            let fy = 0;

            for (let j = 0; j < STAR_COUNT; j++) {
                if (i === j) continue;
                let p2 = stars[j];

                let dx = p2.sprite.x - p1.sprite.x;
                let dy = p2.sprite.y - p1.sprite.y;
                
                let distSq = dx * dx + dy * dy + SOFTENING;
                let dist = Math.sqrt(distSq);

                let force = (G * p2.mass) / (distSq * dist); 

                fx += force * dx;
                fy += force * dy;
            }

            p1.vx += fx * DT;
            p1.vy += fy * DT;
        }

        // --- Обновление позиций спрайтов ---
        for (let i = 0; i < STAR_COUNT; i++) {
            let p = stars[i];
            p.sprite.x += p.vx * DT;
            p.sprite.y += p.vy * DT;
        }
    });
}

init();
</script>
</body>
</html>
