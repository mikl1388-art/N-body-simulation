<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GPU N-Body Симуляция: Добавление по Double Click</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #010208; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 10px; borderRadius: 5px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="info"><small>Даблклик — создать тяжелую звезду<br>Колесо — зум, зажать мышкой — двигать</small></div>
<canvas id="simulationCanvas"></canvas>

<script>
// --- Настройки симуляции ---
const MAX_STARS = 16384;          // Выделяем память на GPU с запасом (128x128 пикселей)
let currentStarCount = 10000;     // Начальное количество активных звезд
const G = 0.5;           
const SOFTENING = 15;    
const MAX_RARIUS_SCALE = 0.5;
const INITIAL_VELOCITY_SCALE = 0.4;
const RANDOM_RADIUS = true;

const MIN_MASS = 1;
const MAX_MASS = 12;

const PHYSICS_DT = 0.5;          
const REAL_STEP = 1000 / 60;     

// Размер текстуры под максимальный лимит звезд (128)
const TEX_SIZE = Math.ceil(Math.sqrt(MAX_STARS));

function createGradientCanvas() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 256, 0);
    gradient.addColorStop(0.0, '#ff4400');
    gradient.addColorStop(0.2, '#ffcc00');
    gradient.addColorStop(0.5, '#ffffff');
    gradient.addColorStop(0.8, '#88ccff');
    gradient.addColorStop(1.0, '#0044ff');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, 256, 1);
    return canvas;
}

// --- ШЕЙДЕРЫ WEBGL2 ---
const quadVertexShader = `#version 300 es
void main() {
    vec2 uv = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
}`;

// Фрагментный шейдер скоростей теперь принимает динамический uCurrentStarCount
const updateVelFragmentShader = `#version 300 es
precision highp float;
uniform sampler2D uPosTex;
uniform sampler2D uVelTex;
uniform int uCurrentStarCount; // Важно: считаем только активные звезды
uniform float uG;
uniform float uSoftening;
uniform float uDT;
out vec4 fragColor;

void main() {
    ivec2 texSize = textureSize(uPosTex, 0);
    ivec2 coord = ivec2(gl_FragCoord.xy);
    int myIndex = coord.y * texSize.x + coord.x;

    vec4 myPosMass = texelFetch(uPosTex, coord, 0);
    vec4 myVel = texelFetch(uVelTex, coord, 0);

    // Если этот пиксель-звезда еще не создан, просто сохраняем его скорость (0)
    if (myIndex >= uCurrentStarCount) {
        fragColor = myVel; return;
    }

    vec2 p1 = myPosMass.xy;
    vec2 vel = myVel.xy;
    vec2 forceAcc = vec2(0.0);

    // Цикл работает строго до uCurrentStarCount
    for (int i = 0; i < uCurrentStarCount; i++) {
        if (i == myIndex) continue;
        ivec2 otherCoord = ivec2(i % texSize.x, i / texSize.x);
        vec4 otherPosMass = texelFetch(uPosTex, otherCoord, 0);
        
        vec2 p2 = otherPosMass.xy;
        float m2 = otherPosMass.z;

        vec2 d = p2 - p1;
        float distSq = d.x * d.x + d.y * d.y + uSoftening;
        float dist = sqrt(distSq);
        
        float f = (uG * m2) / (distSq * dist);
        forceAcc += f * d;
    }

    vel += forceAcc * uDT;
    fragColor = vec4(vel, 0.0, 0.0);
}`;

const updatePosFragmentShader = `#version 300 es
precision highp float;
uniform sampler2D uPosTex;
uniform sampler2D uVelTex;
uniform float uDT;
out vec4 fragColor;

void main() {
    ivec2 coord = ivec2(gl_FragCoord.xy);
    vec4 posMass = texelFetch(uPosTex, coord, 0);
    vec4 vel = texelFetch(uVelTex, coord, 0);

    vec2 pos = posMass.xy + vel.xy * uDT;
    fragColor = vec4(pos, posMass.z, posMass.w);
}`;

const renderVertexShader = `#version 300 es
precision highp float;
uniform sampler2D uPosTex;
uniform int uTexWidth;
uniform vec2 uCameraPan;
uniform float uCameraScale;
uniform vec2 uResolution;
out float vNormMass;

void main() {
    int idx = gl_VertexID;
    ivec2 coord = ivec2(idx % uTexWidth, idx / uTexWidth);
    vec4 posMass = texelFetch(uPosTex, coord, 0);

    vec2 worldPos = posMass.xy;
    vNormMass = posMass.w;

    vec2 screenPos = (worldPos * uCameraScale) + uCameraPan;
    vec2 clipPos = (screenPos / uResolution) * 2.0 - 1.0;
    clipPos.y = -clipPos.y;

    gl_Position = vec4(clipPos, 0.0, 1.0);
    
    // Визуально увеличиваем размер, если масса звезды огромная (для добавленных звезд)
    float massScale = clamp(sqrt(posMass.z / 2.0), 1.0, 5.0);
    gl_PointSize = clamp(5.0 * sqrt(uCameraScale) * massScale, 1.5, 40.0);
}`;

const renderFragmentShader = `#version 300 es
precision highp float;
in float vNormMass;
uniform sampler2D uGradientTex;
out vec4 fragColor;

void main() {
    float d = distance(gl_PointCoord, vec2(0.5));
    if (d > 0.5) discard;
    fragColor = texture(uGradientTex, vec2(vNormMass, 0.5));
}`;

// --- Инициализация WebGL2 ---
const canvas = document.getElementById('simulationCanvas');
const countSpan = document.getElementById('countSpan');
const gl = canvas.getContext('webgl2');

gl.getExtension('EXT_color_buffer_float');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function compileShader(source, type) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
}
function createProg(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compileShader(vs, gl.VERTEX_SHADER));
    gl.attachShader(p, compileShader(fs, gl.FRAGMENT_SHADER));
    gl.linkProgram(p); return p;
}

const velProg = createProg(quadVertexShader, updateVelFragmentShader);
const posProg = createProg(quadVertexShader, updatePosFragmentShader);
const renderProg = createProg(renderVertexShader, renderFragmentShader);

// Выделяем пустые массивы сразу под MAX_STARS
const posData = new Float32Array(TEX_SIZE * TEX_SIZE * 4);
const velData = new Float32Array(TEX_SIZE * TEX_SIZE * 4);

const screenCenterX = canvas.width / 2;
const screenCenterY = canvas.height / 2;

// Заполняем только первую часть (currentStarCount)
for (let i = 0; i < currentStarCount; i++) {
    const angle = (RANDOM_RADIUS ? Math.random() : (i / (currentStarCount + 1))) * Math.PI * 2;
    const radius = (RANDOM_RADIUS ? Math.random() : 1) * (Math.min(screenCenterX, screenCenterY) * MAX_RARIUS_SCALE);
    const mass = MIN_MASS + Math.random() * (MAX_MASS - MIN_MASS);

    const idx = i * 4;
    posData[idx]     = screenCenterX + Math.cos(angle) * radius;
    posData[idx + 1] = screenCenterY + Math.sin(angle) * radius;
    posData[idx + 2] = mass;
    posData[idx + 3] = (mass - MIN_MASS) / (MAX_MASS - MIN_MASS);

    velData[idx]     = -Math.sin(angle) * (Math.sqrt(radius) * INITIAL_VELOCITY_SCALE);
    velData[idx + 1] =  Math.cos(angle) * (Math.sqrt(radius) * INITIAL_VELOCITY_SCALE);
}

function createTex(data) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, TEX_SIZE, TEX_SIZE, 0, gl.RGBA, gl.FLOAT, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
}

let posTex = [createTex(posData), createTex(null)];
let velTex = [createTex(velData), createTex(null)];
let currIdx = 0;

const gradientTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, gradientTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, createGradientCanvas());
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const fb = gl.createFramebuffer();

// --- УПРАВЛЕНИЕ КАМЕРОЙ ---
let cameraX = 0, cameraY = 0, cameraScale = 1.0;
let isDragging = false, startX, startY, startCamX, startCamY;

canvas.addEventListener('mousedown', (e) => {
    isDragging = true; startX = e.clientX; startY = e.clientY;
    startCamX = cameraX; startCamY = cameraY;
});
window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraX = startCamX + (e.clientX - startX);
    cameraY = startCamY + (e.clientY - startY);
});
window.addEventListener('mouseup', () => isDragging = false);

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = 1.1;
    let newScale = e.deltaY < 0 ? cameraScale * zoomFactor : cameraScale / zoomFactor;
    newScale = Math.max(0.05, Math.min(newScale, 30));

    const mouseX = e.offsetX; const mouseY = e.offsetY;
    const worldX = (mouseX - cameraX) / cameraScale;
    const worldY = (mouseY - cameraY) / cameraScale;

    cameraScale = newScale;
    cameraX = mouseX - worldX * cameraScale;
    cameraY = mouseY - worldY * cameraScale;
});

// --- ФУНКЦИЯ ДИНАМИЧЕСКОГО ДОБАВЛЕНИЯ ЗВЕЗДЫ ---
function addNewStar(worldX, worldY, vx, vy, mass) {
    if (currentStarCount >= MAX_STARS) {
        alert("Лимит текстуры исчерпан (16384 звезд)!");
        return;
    }

    const index = currentStarCount;
    const px = index % TEX_SIZE;
    const py = Math.floor(index / TEX_SIZE);

    // Нормализованный цвет (сделаем добавленные звезды яркими, принудительно 1.0)
    const normMass = 1.0; 
    
    const singlePos = new Float32Array([worldX, worldY, mass, normMass]);
    const singleVel = new Float32Array([vx, vy, 0.0, 0.0]);

    // Записываем данные в оба Ping-Pong буфера, чтобы избежать мерцания в следующем кадре
    for (let i = 0; i < 2; i++) {
        gl.bindTexture(gl.TEXTURE_2D, posTex[i]);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, px, py, 1, 1, gl.RGBA, gl.FLOAT, singlePos);

        gl.bindTexture(gl.TEXTURE_2D, velTex[i]);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, px, py, 1, 1, gl.RGBA, gl.FLOAT, singleVel);
    }

    currentStarCount++;
    countSpan.textContent = currentStarCount; // Обновляем счетчик на UI
}

// --- ОБРАБОТЧИК ДВОЙНОГО КЛИКА ---
canvas.addEventListener('dblclick', (e) => {
    const mouseX = e.clientX;
    const mouseY = e.clientY;

    // Важнейший шаг: обратная трансформация экрана в игровой мир с учетом Камеры
    const worldX = (mouseX - cameraX) / cameraScale;
    const worldY = (mouseY - cameraY) / cameraScale;

    // Спавним неподвижную (vx=0, vy=0) тяжелую звезду (масса = 100)
    addNewStar(worldX, worldY, 0, 0, 1000.0);
});

// --- ТАЙМИНГ ФИЗИКИ ---
let lastTime = performance.now();
let accumulator = 0;

// --- РЕНДЕР-ПЕТЛЯ ---
function loop(currentTime) {
    let dt = currentTime - lastTime;
    lastTime = currentTime;
    if (dt > 250) dt = 250; 
    accumulator += dt;

    while (accumulator >= REAL_STEP) {
        let nextIdx = 1 - currIdx;

        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.viewport(0, 0, TEX_SIZE, TEX_SIZE);

        // 1. Считаем СКОРОСТИ
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, velTex[nextIdx], 0);
        gl.useProgram(velProg);
        gl.uniform1i(gl.getUniformLocation(velProg, "uCurrentStarCount"), currentStarCount); // Передаем актуальное число
        gl.uniform1f(gl.getUniformLocation(velProg, "uG"), G);
        gl.uniform1f(gl.getUniformLocation(velProg, "uSoftening"), SOFTENING);
        gl.uniform1f(gl.getUniformLocation(velProg, "uDT"), PHYSICS_DT);
        
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, posTex[currIdx]);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, velTex[currIdx]);
        gl.uniform1i(gl.getUniformLocation(velProg, "uPosTex"), 0);
        gl.uniform1i(gl.getUniformLocation(velProg, "uVelTex"), 1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // 2. Считаем ПОЗИЦИИ
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, posTex[nextIdx], 0);
        gl.useProgram(posProg);
        gl.uniform1f(gl.getUniformLocation(posProg, "uDT"), PHYSICS_DT);
        
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, posTex[currIdx]);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, velTex[nextIdx]);
        gl.uniform1i(gl.getUniformLocation(posProg, "uPosTex"), 0);
        gl.uniform1i(gl.getUniformLocation(posProg, "uVelTex"), 1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        currIdx = nextIdx;
        accumulator -= REAL_STEP;
    }

    // 3. РЕНДЕРИНГ НА ЭКРАН
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.004, 0.008, 0.031, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(renderProg);
    gl.uniform1i(gl.getUniformLocation(renderProg, "uTexWidth"), TEX_SIZE);
    gl.uniform2f(gl.getUniformLocation(renderProg, "uCameraPan"), cameraX, cameraY);
    gl.uniform1f(gl.getUniformLocation(renderProg, "uCameraScale"), cameraScale);
    gl.uniform2f(gl.getUniformLocation(renderProg, "uResolution"), canvas.width, canvas.height);

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, posTex[currIdx]);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, gradientTex);
    gl.uniform1i(gl.getUniformLocation(renderProg, "uPosTex"), 0);
    gl.uniform1i(gl.getUniformLocation(renderProg, "uGradientTex"), 1);

    // Отрисовываем ровно столько точек, сколько у нас активных звезд
    gl.drawArrays(gl.POINTS, 0, currentStarCount);

    requestAnimationFrame(loop);
}

requestAnimationFrame((time) => {
    lastTime = time;
    loop(time);
});
</script>
</body>
</html>
